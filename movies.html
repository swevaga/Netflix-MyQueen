    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.95);
        }
        .modal-content {
            position: relative;
            margin: 15% auto;
            padding: 0;
            width: 95%;
            max-width: 900px;
            background: #141414;
            border: 1px solid #2f2f2f;
            border-radius: 8px;
            overflow: hidden;
        }
        .close {
            color: #fff;
            position: absolute;
            right: 10px;
            top: -50px;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            background: none;
            border: none;
            padding: 0;
        }
        .close:hover,
        .close:focus {
            color: #aaa;
            text-decoration: none;
            cursor: pointer;
        }
        /* Header pop-up ala Netflix (di-inject via JS ke tiap modal). */
        .movies-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            background: linear-gradient(to bottom, #1f1f1f, #141414);
        }
        .movies-modal-header .close {
            position: static;
            flex-shrink: 0;
            font-size: 32px;
            line-height: 1;
            margin-top: -2px;
            color: #fff;
        }
        .movies-modal-badge {
            display: inline-block;
            background: #e50914;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 3px;
            margin-bottom: 8px;
        }
        .movies-modal-title {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
        }
        .modal-content video {
            display: block;
            width: 100%;
            border-radius: 0 0 8px 8px;
        }
        
        @media (min-width: 768px) {
            .modal-content {
                margin: 5% auto;
                width: 90%;
            }
            
            .close {
                right: -40px;
                top: -40px;
                font-size: 40px;
            }
            .movies-modal-header {
                padding: 20px 26px;
            }
            .movies-modal-title {
                font-size: 1.4rem;
            }
        }
    </style>

    <script>
        var activeModal = null;
        var lastFocusedElement = null;

        function openModal(videoId) {
            var modal = document.getElementById(videoId);
            lastFocusedElement = document.activeElement;
            activeModal = modal;
            modal.style.display = "block";
            // Suara video aktif: pause + sembunyikan music island.
            if (window.MusicPlayer) window.MusicPlayer.pauseForVideo();
            // Inject header pop-up ala Netflix (sekali saja per modal).
            if (!modal.querySelector('.movies-modal-header')) {
                var content = modal.querySelector('.modal-content');
                var closeBtn = modal.querySelector('.close');
                var header = document.createElement('div');
                header.className = 'movies-modal-header';
                header.innerHTML = '<div><span class="movies-modal-badge">Now Playing</span><h3 class="movies-modal-title">Video ' + videoId.replace('video', '') + '</h3></div>';
                // Tombol close DIPINDAHKAN ke dalam header (bukan sibling) agar
                // tidak ter-clip oleh overflow:hidden panel dan .close:static berlaku.
                header.appendChild(closeBtn);
                content.insertBefore(header, content.firstChild);
            }
            // Inject overlay "Replay / Tutup" saat video selesai (sekali saja per modal).
            if (!modal.querySelector('.video-ended-overlay')) {
                var videoEl = modal.querySelector('video');
                var wrap = document.createElement('div');
                wrap.className = 'video-wrap';
                videoEl.parentNode.insertBefore(wrap, videoEl);
                wrap.appendChild(videoEl);
                var overlay = document.createElement('div');
                overlay.className = 'video-ended-overlay';
                overlay.innerHTML = '<button type="button" class="ended-btn ended-replay" aria-label="Putar ulang" title="Putar ulang" onclick="replayVideo(\'' + videoId + '\')"><i class="fas fa-redo" aria-hidden="true"></i></button>' +
                    '<button type="button" class="ended-btn ended-close" aria-label="Tutup" title="Tutup" onclick="closeModal(\'' + videoId + '\')"><i class="fas fa-times" aria-hidden="true"></i></button>' +
                    '<div class="series-countdown movie-countdown" role="status" hidden>' +
                        '<div class="series-countdown-main">' +
                            '<div class="series-countdown-ringwrap">' +
                                '<svg class="series-countdown-ring" viewBox="0 0 36 36" aria-hidden="true">' +
                                    '<circle class="ring-bg" cx="18" cy="18" r="15.9" fill="none" stroke-width="3"></circle>' +
                                    '<circle class="ring-fg" cx="18" cy="18" r="15.9" fill="none" stroke-width="3" stroke-linecap="round"></circle>' +
                                '</svg>' +
                                '<span class="series-countdown-num">10</span>' +
                            '</div>' +
                            '<span class="series-countdown-label">Memutar episode berikutnya</span>' +
                        '</div>' +
                        '<div class="series-countdown-actions">' +
                            '<button type="button" class="series-countdown-play" onclick="moviesPlayNow(\'' + videoId + '\')">Putar sekarang</button>' +
                            '<button type="button" class="series-countdown-cancel" onclick="moviesCancelCountdown(\'' + videoId + '\')" aria-label="Batal">&times;</button>' +
                        '</div>' +
                    '</div>';
                wrap.appendChild(overlay);
            }
            var overlay = modal.querySelector('.video-ended-overlay');
            if (overlay) overlay.classList.remove('show');
            var closeBtn = modal.querySelector(".close");
            if (closeBtn) closeBtn.focus();
            var video = document.getElementById(videoId + "-player");
            // Video selesai → resume music island + tampilkan tombol Replay/Tutup.
            if (!video.dataset.musicHooked) {
                video.dataset.musicHooked = "1";
                video.addEventListener('ended', function () {
                    if (window.MusicPlayer) window.MusicPlayer.resumeFromVideo();
                    showEndedOverlay(videoId);
                });
            }
            // Klik thumbnail = user gesture: autoplay dengan suara aktif diizinkan.
            video.muted = false;
            video.autoplay = true;
            var p = video.play();
            if (p && p.catch) p.catch(function(){});
        }

        function closeModal(videoId) {
            stopMoviesCountdown(videoId);
            var modal = document.getElementById(videoId);
            var video = modal.querySelector("video");
            video.pause();
            video.currentTime = 0;
            modal.style.display = "none";
            // Video selesai: kembalikan music island.
            if (window.MusicPlayer) window.MusicPlayer.resumeFromVideo();
            if (activeModal === modal) activeModal = null;
            if (lastFocusedElement) lastFocusedElement.focus();
        }

        function showEndedOverlay(videoId) {
            var modal = document.getElementById(videoId);
            var overlay = modal.querySelector('.video-ended-overlay');
            if (overlay) overlay.classList.add('show');
            startMoviesCountdown(videoId);
        }

        function replayVideo(videoId) {
            stopMoviesCountdown(videoId);
            var modal = document.getElementById(videoId);
            var overlay = modal.querySelector('.video-ended-overlay');
            if (overlay) overlay.classList.remove('show');
            var video = modal.querySelector('video');
            video.currentTime = 0;
            var p = video.play();
            if (p && p.catch) p.catch(function(){});
            // Suara video aktif kembali: pause + sembunyikan music island.
            if (window.MusicPlayer) window.MusicPlayer.pauseForVideo();
        }

        /* ===== Countdown "Memutar episode berikutnya" (ala Netflix) =====
           Sama seperti series: setelah video selesai, hitung mundur 10 detik
           dengan ring, lalu video diputar ulang otomatis. Per-modal (tiap
           videoId punya timer sendiri) karena movies punya 25 modal. */
        var MOVIES_COUNTDOWN_TOTAL = 10; // default jika tidak ada data-countdown
        var moviesCountdownTimers = {};
        var moviesCountdownLeft = {};
        var moviesCountdownTotal = {};

        // Total hitung mundur konfigurabel per video (prioritas):
        //   <video data-countdown="5"> → per video (mis. demo pendek)
        //   <body data-countdown="5">  → default per halaman
        //   (tanpa keduanya)            → MOVIES_COUNTDOWN_TOTAL (10)
        function moviesCountdownTotalFor(videoId) {
            var video = document.getElementById(videoId + '-player');
            if (video && video.getAttribute('data-countdown')) {
                var v = parseInt(video.getAttribute('data-countdown'), 10);
                if (!isNaN(v) && v > 0) return v;
            }
            var body = document.body.getAttribute('data-countdown');
            if (body) {
                var n = parseInt(body, 10);
                if (!isNaN(n) && n > 0) return n;
            }
            return MOVIES_COUNTDOWN_TOTAL;
        }

        function startMoviesCountdown(videoId) {
            stopMoviesCountdown(videoId);
            var modal = document.getElementById(videoId);
            var el = modal.querySelector('.series-countdown');
            if (!el) return;
            el.hidden = false;
            moviesCountdownTotal[videoId] = moviesCountdownTotalFor(videoId);
            moviesCountdownLeft[videoId] = moviesCountdownTotal[videoId];
            updateMoviesCountdown(videoId);
            moviesCountdownTimers[videoId] = setInterval(function () {
                moviesCountdownLeft[videoId]--;
                if (moviesCountdownLeft[videoId] <= 0) {
                    stopMoviesCountdown(videoId);
                    replayVideo(videoId);
                    return;
                }
                updateMoviesCountdown(videoId);
            }, 1000);
        }

        function updateMoviesCountdown(videoId) {
            var modal = document.getElementById(videoId);
            var num = modal.querySelector('.series-countdown-num');
            if (num) num.textContent = moviesCountdownLeft[videoId];
            var ring = modal.querySelector('.series-countdown-ring .ring-fg');
            if (ring) {
                var circ = 2 * Math.PI * 15.9;
                ring.style.strokeDasharray = circ;
                ring.style.strokeDashoffset = circ * (1 - moviesCountdownLeft[videoId] / moviesCountdownTotal[videoId]);
            }
        }

        function stopMoviesCountdown(videoId) {
            if (moviesCountdownTimers[videoId]) {
                clearInterval(moviesCountdownTimers[videoId]);
                moviesCountdownTimers[videoId] = null;
            }
            var modal = document.getElementById(videoId);
            if (!modal) return;
            var el = modal.querySelector('.series-countdown');
            if (el) el.hidden = true;
        }

        function moviesPlayNow(videoId) {
            stopMoviesCountdown(videoId);
            replayVideo(videoId);
        }

        function moviesCancelCountdown(videoId) {
            stopMoviesCountdown(videoId);
        }

        document.addEventListener("keydown", function(event) {
            if (!activeModal) return;
            if (event.key === "Escape") {
                event.preventDefault();
                closeModal(activeModal.id);
                return;
            }
            if (event.key === "Tab") {
                var focusables = activeModal.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"]), video, [role="button"]');
                if (focusables.length === 0) return;
                var first = focusables[0];
                var last = focusables[focusables.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
        });

    </script>
